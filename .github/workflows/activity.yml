name: Refresh contribution snapshot
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Refresh assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_activity.py
      - name: Propose snapshot update for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- assets/activity.svg assets/activity-mobile.svg; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C chore/activity-snapshot
          git add assets/activity.svg assets/activity-mobile.svg
          git commit -m 'chore: refresh GitHub contribution snapshot'
          git push --force-with-lease origin chore/activity-snapshot
          if ! gh pr list --head chore/activity-snapshot --json number --jq '.[].number' | grep -q .; then
            gh pr create --base main --head chore/activity-snapshot --title 'Refresh contribution snapshot' --body 'Updates the dated local contribution assets using the GitHub API. No third-party widgets. Review before merging.'
          fi
